name: Build Robot Tea

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build RobotTea.exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name RobotTea --collect-all customtkinter main.py

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: RobotTea-Windows
          path: dist/RobotTea.exe
          if-no-files-found: error
          retention-days: 14
